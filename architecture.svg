<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1a1a2e; }
      .layer-title { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .layer-sub { font-size: 12px; fill: #eef2ff; }
      .box-label { font-size: 12px; font-weight: 600; fill: #1a1a2e; }
      .box-sub { font-size: 11px; fill: #4b5563; }
      .arrow-label { font-size: 11px; font-style: italic; fill: #6b7280; }
      .dlq-label { font-size: 12px; font-weight: 700; fill: #b91c1c; }
      .dlq-sub { font-size: 11px; fill: #b91c1c; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 9,3 0,6" fill="#334155"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 9,3 0,6" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="700" rx="16" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" class="title">Event-Driven Order Pipeline</text>
  <text x="480" y="60" text-anchor="middle" class="arrow-label">nobody calls anybody &#8212; events flow, services react</text>

  <!-- Producer -->
  <rect x="40" y="100" width="150" height="90" rx="12" fill="#2563eb"/>
  <text x="60" y="130" class="layer-title">Order API</text>
  <text x="60" y="152" class="layer-sub">publishes events</text>
  <text x="60" y="170" class="layer-sub">knows zero consumers</text>

  <!-- EventBridge bus -->
  <rect x="250" y="90" width="240" height="110" rx="12" fill="#FF9900"/>
  <text x="270" y="120" class="layer-title">Amazon EventBridge</text>
  <text x="270" y="142" class="layer-sub">event bus + rules</text>
  <text x="270" y="162" class="layer-sub">match: source = shop.orders</text>
  <text x="270" y="180" class="layer-sub">detail-type = OrderCreated.v1</text>

  <!-- Schema registry note -->
  <rect x="640" y="90" width="280" height="110" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="780" y="118" text-anchor="middle" class="box-label">Schema Registry</text>
  <text x="780" y="140" text-anchor="middle" class="box-sub">versioned event contracts</text>
  <text x="780" y="158" text-anchor="middle" class="box-sub">OrderCreated.v1 &#8594; v2</text>
  <text x="780" y="176" text-anchor="middle" class="box-sub">break loudly, not silently</text>

  <!-- Producer -> bus -->
  <line x1="190" y1="145" x2="244" y2="145" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="217" y="136" text-anchor="middle" class="arrow-label">put_events</text>

  <!-- Bus -> queues -->
  <line x1="310" y1="200" x2="164" y2="264" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="222" y="252" text-anchor="middle" class="arrow-label">fulfillment</text>
  <line x1="370" y1="200" x2="478" y2="264" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="438" y="252" text-anchor="middle" class="arrow-label">payments</text>
  <line x1="440" y1="200" x2="796" y2="264" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="640" y="248" text-anchor="middle" class="arrow-label">notifications</text>

  <!-- Queues -->
  <rect x="70" y="270" width="180" height="95" rx="12" fill="#7c3aed"/>
  <text x="90" y="300" class="layer-title">SQS (standard)</text>
  <text x="90" y="322" class="layer-sub">buffer + decouple</text>
  <text x="90" y="340" class="layer-sub">at-least-once, unordered</text>

  <rect x="390" y="270" width="180" height="95" rx="12" fill="#7c3aed"/>
  <text x="410" y="300" class="layer-title">SQS FIFO</text>
  <text x="410" y="322" class="layer-sub">strict ordering</text>
  <text x="410" y="340" class="layer-sub">MessageGroupId = orderId</text>

  <rect x="710" y="270" width="180" height="95" rx="12" fill="#059669"/>
  <text x="730" y="300" class="layer-title">SNS topic</text>
  <text x="730" y="322" class="layer-sub">fan-out 1 &#8594; many</text>
  <text x="730" y="340" class="layer-sub">email + SMS in parallel</text>

  <!-- Queue -> consumer arrows -->
  <line x1="160" y1="365" x2="160" y2="449" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="480" y1="365" x2="480" y2="449" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="800" y1="365" x2="800" y2="449" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- DLQs -->
  <rect x="70" y="375" width="180" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="398" text-anchor="middle" class="dlq-label">DLQ</text>
  <text x="160" y="418" text-anchor="middle" class="dlq-sub">after 5 failed receives</text>

  <rect x="390" y="375" width="180" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="398" text-anchor="middle" class="dlq-label">DLQ</text>
  <text x="480" y="418" text-anchor="middle" class="dlq-sub">after 5 failed receives</text>

  <rect x="710" y="375" width="180" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="398" text-anchor="middle" class="dlq-label">DLQ</text>
  <text x="800" y="418" text-anchor="middle" class="dlq-sub">after 5 failed receives</text>

  <!-- Poison arrows queue -> DLQ (offset to the side to avoid the consumer arrow) -->
  <line x1="238" y1="330" x2="246" y2="392" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
  <line x1="558" y1="330" x2="566" y2="392" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
  <line x1="878" y1="330" x2="886" y2="392" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
  <text x="252" y="368" class="dlq-sub">poison</text>

  <!-- Consumers -->
  <rect x="70" y="455" width="180" height="90" rx="12" fill="#0e7490"/>
  <text x="90" y="485" class="layer-title">&#955; Fulfillment</text>
  <text x="90" y="507" class="layer-sub">ships the order</text>
  <text x="90" y="525" class="layer-sub">idempotent consumer</text>

  <rect x="390" y="455" width="180" height="90" rx="12" fill="#0e7490"/>
  <text x="410" y="485" class="layer-title">&#955; Payments</text>
  <text x="410" y="507" class="layer-sub">captures payment</text>
  <text x="410" y="525" class="layer-sub">idempotent + ordered</text>

  <rect x="710" y="455" width="180" height="90" rx="12" fill="#0e7490"/>
  <text x="730" y="485" class="layer-title">&#955; Email + SMS</text>
  <text x="730" y="507" class="layer-sub">SNS fan-out targets</text>
  <text x="730" y="525" class="layer-sub">scale independently</text>

  <!-- Bottom notes -->
  <rect x="40" y="575" width="440" height="95" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="260" y="603" text-anchor="middle" class="box-label">Duplicates are normal</text>
  <text x="260" y="625" text-anchor="middle" class="box-sub">design for at-least-once: idempotency key</text>
  <text x="260" y="643" text-anchor="middle" class="box-sub">on every side effect (see order_processor.py)</text>

  <rect x="520" y="575" width="400" height="95" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="720" y="603" text-anchor="middle" class="box-label">Observability</text>
  <text x="720" y="625" text-anchor="middle" class="box-sub">CloudWatch alarm on DLQ depth</text>
  <text x="720" y="643" text-anchor="middle" class="box-sub">X-Ray traces eventId end-to-end</text>
</svg>
